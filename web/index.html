<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA-OS | Evolving Virtual Assistant</title>
    <style>
        :root {
            --bg-main: #05071a;
            --bg-panel: rgba(10, 15, 30, 0.85);
            --accent: #00f0ff;
            --accent-2: #9d4edd;
            --accent-soft: rgba(0, 240, 255, 0.15);
            --text-primary: #eef2ff;
            --text-secondary: #aeb7d0;
            --text-muted: #6b7790;
            --danger: #ff4d4d;
            --success: #4ec9b0;
            --warning: #dcdcaa;
            --shadow-glow: 0 0 35px rgba(0, 240, 255, 0.35);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08), transparent 25%),
                radial-gradient(circle at 90% 20%, rgba(157, 78, 221, 0.08), transparent 25%),
                linear-gradient(180deg, #05071a 0%, #02030a 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 290px 1fr 310px;
            height: 100vh;
            gap: 18px;
            padding: 18px;
        }

        /* ========== PAINEL ESQUERDA ========== */
        .panel-left {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel-card {
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(0, 240, 255, 0.12);
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 0 25px rgba(0, 0, 0, 0.35);
        }

        .panel-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .stat-label { color: var(--text-secondary); }
        .stat-value { color: var(--accent); font-weight: 600; }

        .bar-container {
            height: 8px;
            background: rgba(0, 240, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease, background 0.3s ease;
        }

        .bar-fill.cpu { background: linear-gradient(90deg, #00f0ff, #009fb7); width: 0%; }
        .bar-fill.ram { background: linear-gradient(90deg, #4ec9b0, #2f8f7a); width: 0%; }
        .bar-fill.gpu { background: linear-gradient(90deg, #9d4edd, #6a1b9a); width: 0%; }

        /* ========== CENTRO — EVA NÚCLEO ========== */
        .center-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .eva-container {
            position: relative;
            width: 360px;
            height: 460px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #ffffff, #00f0ff, #9d4edd);
            box-shadow:
                0 0 20px var(--accent),
                0 0 40px var(--accent),
                0 0 60px var(--accent-2);
            animation: corePulse 3s ease-in-out infinite;
        }

        .core-inner {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }

        /* Redes ao redor */
        .network-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
        }

        .network-ring-1 {
            width: 130px;
            height: 130px;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent);
            animation: rotate1 10s linear infinite;
        }

        .network-ring-2 {
            width: 170px;
            height: 170px;
            border-left-color: var(--accent-2);
            border-right-color: var(--accent-2);
            animation: rotate2 14s linear infinite reverse;
        }

        .network-ring-3 {
            width: 210px;
            height: 210px;
            border-color: rgba(0, 240, 255, 0.25);
            animation: rotate1 18s linear infinite;
        }

        .nodes {
            position: absolute;
            width: 260px;
            height: 260px;
            animation: rotate2 20s linear infinite;
        }

        .node {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .node:nth-child(1) { top: 10%; left: 50%; transform: translateX(-50%); }
        .node:nth-child(2) { top: 25%; left: 85%; }
        .node:nth-child(3) { top: 50%; left: 90%; }
        .node:nth-child(4) { top: 75%; left: 85%; }
        .node:nth-child(5) { top: 90%; left: 50%; transform: translateX(-50%); }
        .node:nth-child(6) { top: 75%; left: 15%; }
        .node:nth-child(7) { top: 50%; left: 10%; }
        .node:nth-child(8) { top: 25%; left: 15%; }

        .waves {
            position: absolute;
            bottom: 40px;
            display: flex;
            align-items: center;
            gap: 5px;
            height: 50px;
        }

        .wave-bar {
            width: 5px;
            background: linear-gradient(to top, var(--accent), var(--accent-2));
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Estados */
        .eva-idle .network-ring-1 { animation-duration: 10s; opacity: 0.45; }
        .eva-idle .network-ring-2 { animation-duration: 14s; opacity: 0.35; }
        .eva-idle .network-ring-3 { animation-duration: 18s; opacity: 0.25; }
        .eva-idle .core { animation-duration: 3s; }

        .eva-listening .network-ring-1 { animation-duration: 5s; opacity: 0.8; }
        .eva-listening .network-ring-2 { animation-duration: 7s; opacity: 0.7; }
        .eva-listening .network-ring-3 { animation-duration: 9s; opacity: 0.5; }
        .eva-listening .waves .wave-bar { opacity: 1; animation: waveListen 0.7s ease-in-out infinite alternate; }
        .eva-listening .core { animation-duration: 1.5s; box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent), 0 0 90px var(--accent-2); }

        .eva-speaking .network-ring-1 { animation-duration: 2s; opacity: 1; }
        .eva-speaking .network-ring-2 { animation-duration: 3s; opacity: 0.9; }
        .eva-speaking .network-ring-3 { animation-duration: 4s; opacity: 0.65; }
        .eva-speaking .waves .wave-bar { opacity: 1; animation: waveSpeak 0.3s ease-in-out infinite alternate; }
        .eva-speaking .core { animation-duration: 0.8s; box-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent), 0 0 120px var(--accent-2); }

        @keyframes corePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes rotate1 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate2 {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes waveListen {
            0% { height: 8px; }
            100% { height: 22px; }
        }

        @keyframes waveSpeak {
            0% { height: 10px; }
            100% { height: 38px; }
        }

        .status-label {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ========== PAINEL DIREITA ========== */
        .panel-right {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .time-display {
            text-align: center;
        }

        .time-large {
            font-size: 48px;
            font-weight: 300;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .date-small {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .location-input {
            width: 100%;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.18);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            margin-top: 10px;
            outline: none;
        }

        .location-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.1);
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .weather-icon { font-size: 42px; }
        .weather-temp { font-size: 34px; font-weight: 300; }
        .weather-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
            font-size: 12px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .control-btn {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 14px 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }

        .control-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .control-btn.muted {
            border-color: var(--danger);
            background: rgba(255, 77, 77, 0.08);
            color: var(--danger);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .theme-btn {
            height: 54px;
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .theme-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.25);
        }

        .theme-1 { background: linear-gradient(135deg, #05071a, #101840); }
        .theme-2 { background: linear-gradient(135deg, #071020, #142850); }
        .theme-3 { background: linear-gradient(135deg, #0a0518, #251045); }
        .theme-4 { background: linear-gradient(135deg, #051008, #102818); }

        .chat-section {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(620px, 92%);
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(0, 240, 255, 0.12);
            padding: 18px 22px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .chat-messages {
            max-height: 130px;
            overflow-y: auto;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .msg-line {
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 240, 255, 0.05);
        }

        .msg-user { color: var(--accent); }
        .msg-eva { color: var(--text-secondary); }

        .chat-input-row {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none;
            border-radius: var(--radius-md);
            padding: 0 22px;
            cursor: pointer;
            font-size: 20px;
            color: #05071a;
            transition: var(--transition);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- ========== PAINEL ESQUERDA — SISTEMA ========== -->
        <div class="panel-left">
            <div class="panel-card">
                <div class="panel-title">💻 Sistema</div>
                <div class="stat-row"><span class="stat-label">Processador</span><span class="stat-value" id="cpuName">—</span></div>
                <div class="stat-row"><span class="stat-label">Uso CPU</span><span class="stat-value" id="cpuPercent">0%</span></div>
                <div class="bar-container"><div class="bar-fill cpu" id="cpuBar"></div></div>
                                <div class="stat-row"><span class="stat-label">Memória RAM</span><span class="stat-value" id="ramPercent">0%</span></div>
                <div class="bar-container"><div class="bar-fill ram" id="ramBar"></div></div>
                
                <div class="stat-row"><span class="stat-label">GPU</span><span class="stat-value" id="gpuName">—</span></div>
                <div class="stat-row"><span class="stat-label">Uso GPU</span><span class="stat-value" id="gpuPercent">0%</span></div>
                <div class="bar-container"><div class="bar-fill gpu" id="gpuBar"></div></div>
            </div>

            <div class="panel-card">
                <div class="panel-title">🤖 Modelo Ollama</div>
                <select id="modelSelector" class="location-input">
                    <option value="llama3.2">Llama 3.2</option>
                    <option value="llama3.1">Llama 3.1</option>
                    <option value="gemma2">Gemma 2</option>
                    <option value="mistral">Mistral</option>
                    <option value="phi3">Phi 3</option>
                </select>
                <div style="margin-top: 10px; font-size: 12px; color: var(--text-muted);">Atual: <span id="currentModel">llama3.2</span></div>
            </div>

            <div class="panel-card">
                <div class="panel-title">🎨 Tema da Interface</div>
                <div class="theme-grid">
                    <button class="theme-btn theme-1 active" data-theme="cyber" title="Ciano Neon">◈</button>
                    <button class="theme-btn theme-2" data-theme="deep" title="Azul Profundo">◉</button>
                    <button class="theme-btn theme-3" data-theme="purple" title="Cosmic Purple">✧</button>
                    <button class="theme-btn theme-4" data-theme="forest" title="Floresta Escura">❖</button>
                </div>
            </div>
        </div>

        <!-- ========== CENTRO — NÚCLEO DA EVA ========== -->
        <div class="center-area">
            <div class="eva-container eva-idle" id="evaContainer">
                <div class="core-wrapper">
                    <div class="network-ring network-ring-1"></div>
                    <div class="network-ring network-ring-2"></div>
                    <div class="network-ring network-ring-3"></div>
                    
                    <div class="nodes">
                        <div class="node"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                    </div>
                    
                    <div class="core-inner"></div>
                    <div class="core"></div>
                </div>

                <div class="waves" id="waves">
                    <div class="wave-bar" style="height: 8px; animation-delay: 0s;"></div>
                    <div class="wave-bar" style="height: 14px; animation-delay: 0.1s;"></div>
                    <div class="wave-bar" style="height: 10px; animation-delay: 0.2s;"></div>
                    <div class="wave-bar" style="height: 18px; animation-delay: 0.3s;"></div>
                    <div class="wave-bar" style="height: 8px; animation-delay: 0.4s;"></div>
                    <div class="wave-bar" style="height: 12px; animation-delay: 0.15s;"></div>
                    <div class="wave-bar" style="height: 16px; animation-delay: 0.25s;"></div>
                </div>

                <div class="status-label" id="statusLabel">EVA — Aguardando</div>
            </div>
        </div>

        <!-- ========== PAINEL DIREITA — TEMPO E CONTROLES ========== -->
        <div class="panel-right">
            <div class="panel-card">
                <div class="time-display">
                    <div class="time-large" id="timeDisplay">00:00</div>
                    <div class="date-small" id="dateDisplay">—</div>
                </div>
                <input type="text" id="locationInput" class="location-input" placeholder="Sua cidade..." value="Campinas, BR">
                
                <div class="weather-main">
                    <div>
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-temp" id="weatherTemp">26°C</div>
                        <div class="weather-desc" id="weatherDesc">Ensolarado</div>
                    </div>
                </div>
                <div class="weather-details">
                    <div>💧 Umidade: <span id="weatherHumidity">58%</span></div>
                    <div>🌬️ Vento: <span id="weatherWind">10 km/h</span></div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">🎙️ Controles</div>
                <div class="controls-grid">
                    <button class="control-btn" id="micToggle">🎙️ Microfone</button>
                    <button class="control-btn" id="listenBtn">👂 Ouvir</button>
                    <button class="control-btn" id="resetBtn">↻ Reset</button>
                    <button class="control-btn" id="infoBtn">ℹ️ Info</button>
                </div>
                <div style="margin-top: 14px; font-size: 12px; color: var(--text-muted);">
                    Status: <span id="micStatus" style="color: var(--success);">Sistema ativo</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== ÁREA DE CHAT ========== -->
    <div class="chat-section">
        <div class="chat-messages" id="chatMessages">
            <div class="msg-line msg-eva">EVA-OS: Sistema online. Pronta para interagir.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" class="chat-input" placeholder="Digite sua mensagem...">
            <button class="send-btn" id="sendMsg">➤</button>
        </div>
    </div>

    <script>
        // ===== ESTADO GLOBAL =====
        const state = {
            isListening: false,
            isSpeaking: false,
            isMuted: false,
            currentTheme: 'cyber',
            currentModel: 'llama3.2'
        };

        // ===== ELEMENTOS =====
        const evaContainer = document.getElementById('evaContainer');
        const statusLabel = document.getElementById('statusLabel');
        const micToggle = document.getElementById('micToggle');
        const micStatus = document.getElementById('micStatus');
        const modelSelector = document.getElementById('modelSelector');
        const currentModelEl = document.getElementById('currentModel');
        const locationInput = document.getElementById('locationInput');

        // ===== TEMPO E DATA =====
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('timeDisplay').textContent = timeStr;
            document.getElementById('dateDisplay').textContent = dateStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ===== SIMULAÇÃO DE SISTEMA =====
        function updateSystemStats() {
            const cpu = Math.floor(Math.random() * 35) + 8;
            const ram = Math.floor(Math.random() * 25) + 30;
            const gpu = Math.floor(Math.random() * 20) + 5;
            
            document.getElementById('cpuPercent').textContent = cpu + '%';
            document.getElementById('cpuBar').style.width = cpu + '%';
            document.getElementById('ramPercent').textContent = ram + '%';
            document.getElementById('ramBar').style.width = ram + '%';
            document.getElementById('gpuPercent').textContent = gpu + '%';
            document.getElementById('gpuBar').style.width = gpu + '%';
            
            document.getElementById('cpuName').textContent = 'i7-8700K';
            document.getElementById('gpuName').textContent = 'RX 580 8GB';
        }
        setInterval(updateSystemStats, 3000);
        updateSystemStats();

        // ===== CLIMA SIMULADO =====
        const weatherData = {
            'Campinas, BR': { temp: 26, icon: '☀️', desc: 'Ensolarado', humidity: 58, wind: 10 },
            'São Paulo, BR': { temp: 22, icon: '⛅', desc: 'Parcialmente nublado', humidity: 70, wind: 15 },
            'Rio de Janeiro, BR': { temp: 30, icon: '🌤️', desc: 'Dia claro', humidity: 75, wind: 8 }
        };
        
        function updateWeather(location) {
            const w = weatherData[location] || { temp: 22, icon: '🌐', desc: '—', humidity: 50, wind: 0 };
            document.getElementById('weatherTemp').textContent = w.temp + '°C';
            document.getElementById('weatherIcon').textContent = w.icon;
            document.getElementById('weatherDesc').textContent = w.desc;
            document.getElementById('weatherHumidity').textContent = w.humidity + '%';
            document.getElementById('weatherWind').textContent = w.wind + ' km/h';
        }
        locationInput.addEventListener('change', () => updateWeather(locationInput.value));
        updateWeather(locationInput.value);

        // ===== ESTADOS DA EVA =====
        function setEvaState(stateName) {
            evaContainer.classList.remove('eva-idle', 'eva-listening', 'eva-speaking');
            evaContainer.classList.add(`eva-${stateName}`);
            
            const labels = {
                idle: 'EVA — Aguardando',
                listening: 'EVA — Ouvindo...',
                speaking: 'EVA — Processando...'
            };
            statusLabel.textContent = labels[stateName];
        }

        // ===== MICROFONE =====
        micToggle.addEventListener('click', () => {
            state.isMuted = !state.isMuted;
            micToggle.classList.toggle('muted', state.isMuted);
            micToggle.innerHTML = state.isMuted ? '🔇 Desmutar' : '🎙️ Microfone';
            micStatus.textContent = state.isMuted ? 'Microfone desativado' : 'Sistema ativo';
            micStatus.style.color = state.isMuted ? 'var(--danger)' : 'var(--success)';
            
            if (state.isMuted) {
                setEvaState('idle');
            }
        });

        // ===== BOTÃO OUVIR =====
        document.getElementById('listenBtn').addEventListener('click', () => {
            if (!state.isMuted) {
                setEvaState('listening');
                setTimeout(() => setEvaState('idle'), 3000);
                addMessage('Sistema', 'Modo escuta ativado');
            }
        });

        // ===== SELETOR DE MODELO =====
        modelSelector.addEventListener('change', () => {
            state.currentModel = modelSelector.value;
            currentModelEl.textContent = state.currentModel;
            addMessage('Sistema', `Modelo alterado para: ${state.currentModel}`);
        });

        // ===== TEMAS =====
        const themes = {
            cyber: { accent: '#00f0ff', accent2: '#9d4edd', bg1: '#05071a', bg2: '#101840' },
            deep: { accent: '#73c2fb', accent2: '#4ecdc4', bg1: '#071020', bg2: '#142850' },
            purple: { accent: '#d8b4fe', accent2: '#c084fc', bg1: '#0a0518', bg2: '#251045' },
            forest: { accent: '#a8e6cf', accent2: '#52b788', bg1: '#051008', bg2: '#102818' }
        };
        
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const themeName = btn.dataset.theme;
                const t = themes[themeName];
                document.documentElement.style.setProperty('--accent', t.accent);
                document.documentElement.style.setProperty('--accent-2', t.accent2);
                document.body.style.background = `
                    radial-gradient(circle at 10% 10%, ${t.accent}15, transparent 25%),
                    radial-gradient(circle at 90% 20%, ${t.accent2}15, transparent 25%),
                    linear-gradient(180deg, ${t.bg1} 0%, #02030a 100%)
                `;
                addMessage('Sistema', `Tema alterado`);
            });
        });

        // ===== CHAT =====
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');
        
        function addMessage(sender, text) {
            const line = document.createElement('div');
            line.className = `msg-line msg-${sender.toLowerCase()}`;
            line.textContent = `${sender}: ${text}`;
            chatMessages.appendChild(line);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function simulateEvaResponse(userText) {
            setEvaState('listening');
            setTimeout(() => {
                setEvaState('speaking');
                const responses = [
                    `Processando sua mensagem: "${userText}". Como posso ajudar mais?`,
                    `Recebido. Estou analisando as informações.`,
                    `Olá! Tudo bem por aqui. Em que mais posso colaborar?`
                ];
                const resp = responses[Math.floor(Math.random() * responses.length)];
                addMessage('EVA', resp);
                setTimeout(() => setEvaState('idle'), 2500);
            }, 1200);
        }
        
        document.getElementById('sendMsg').addEventListener('click', () => {
            const text = chatInput.value.trim();
            if (!text) return;
            addMessage('Você', text);
            chatInput.value = '';
            simulateEvaResponse(text);
        });
        
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendMsg').click();
            }
        });

        // ===== BOTÃO RESET =====
        document.getElementById('resetBtn').addEventListener('click', () => {
            chatMessages.innerHTML = '<div class="msg-line msg-eva">EVA: Sistema reiniciado. Olá novamente!</div>';
            setEvaState('idle');
            addMessage('Sistema', 'Interface reiniciada');
        });

        // ===== BOTÃO INFO =====
        document.getElementById('infoBtn').addEventListener('click', () => {
            addMessage('Sistema', `EVA-OS v1.0 | Modelo: ${state.currentModel} | Online`);
        });

        // ===== INICIALIZAÇÃO =====
        setTimeout(() => {
            addMessage('Sistema', 'EVA-OS online e conectada');
        }, 500);
    </script>
</body>
</html>
